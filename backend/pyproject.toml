[project]
name = "amrita-go"
version = "0.1.0a1"
description = "A agent workstation built on AmritaCore"
requires-python = ">=3.10,<3.15"
dependencies = [
  "amrita-core[anthropic]>=1.3.1",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.9.0",
  "httpx>=0.28.1",
  "pyyaml>=6.0",
  "cryptography>=43.0",
  "keyring>=25.0 ; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = ["ruff>=0.12.8"]

[project.scripts]
amrita-go = "app.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Builds frontend/dist when missing and ships it as app/_frontend, so the
# installed wheel can serve the SPA without the frontend sources.
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["../frontend"]

[tool.ruff.lint]
select = ["F", "W", "E", "UP", "ASYNC", "C4", "T10", "Q", "RUF", "I", "PERF"]
ignore = [
    "E501",
    "RUF001",
    "RUF002",
    "RUF003",
    "RUF036",
    "UP037",
    "PERF203",
]

[tool.ruff.lint.per-file-ignores]
"app/capabilities/mcp_runtime.py" = ["ASYNC109"]
"app/runtime/agent_runtime.py" = ["BLE001"]
"app/plugins/__init__.py" = ["BLE001"]
"app/capabilities/__init__.py" = ["BLE001"]
"app/core/workspaces.py" = ["ASYNC240"]
"app/main.py" = ["ASYNC240"]
"app/tools/shell.py" = ["ASYNC240"]
"scripts/*.py" = ["ASYNC210", "E402", "ASYNC110"]

[tool.pyright]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
# The venv is a Windows layout (Lib/site-packages). Pyright launched from WSL
# looks for lib/pythonX.Y/site-packages, so point it at the real directory.
extraPaths = [".venv/Lib/site-packages"]
include = ["app"]
exclude = ["**/__pycache__", "../frontend"]

# Use the sibling AmritaCore checkout so the agent always runs against the
# framework source you are developing with.
[tool.uv.sources]
amrita-core = { path = "../../AmritaCore", editable = true }

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.17.2",
]
