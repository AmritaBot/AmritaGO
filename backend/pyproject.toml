[project]
name = "amrita-go"
version = "0.1.0a9"
description = "A agent workstation built on AmritaCore"
requires-python = ">=3.10,<3.15"
dependencies = [
  "amrita-core[anthropic]>=1.3.1",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.9.0",
  "httpx>=0.28.1",
  "pyyaml>=6.0",
  "cryptography>=43.0",
  "keyring>=25.0 ; sys_platform == 'linux'",
  "faskill[amrita]>=0.3.0",
]
license = "AGPL-3.0-or-later"
# Stage the repository LICENSE because Hatchling only packages backend files.
license-files = ["LICENSE"]

[project.optional-dependencies]
dev = ["ruff>=0.12.8"]

[project.scripts]
amrita-go = "app.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Bundle frontend assets so the installed wheel can serve the SPA.
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["../frontend"]

[tool.ruff.lint]
select = ["F", "W", "E", "UP", "ASYNC", "C4", "T10", "Q", "RUF", "I", "PERF"]
ignore = [
    "E501",
    "RUF001",
    "RUF002",
    "RUF003",
    "RUF036",
    "UP037",
    "E402",
    "PERF203",
]
