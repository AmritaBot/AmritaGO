name: CI

on:
  push:
    branches:
      - "main"
      - "master"
    paths:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: ${{ !contains(github.event.head_commit.message, '[ci skip]') && !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # pyproject.toml pins amrita-core to the sibling checkout (../../AmritaCore).
      - name: Checkout AmritaCore
        run: git clone --depth 1 https://github.com/AmritaBot/AmritaCore.git "$GITHUB_WORKSPACE/../AmritaCore"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Set up Python
        run: uv python install

      - name: Install backend dependencies
        run: |
          cd backend
          uv venv
          uv sync --all-extras

      - name: Install frontend dependencies
        run: |
          cd frontend
          bun install --frozen-lockfile

      - name: Check code format
        run: |
          cd backend
          uv run ruff check . --exit-non-zero-on-fix

      - name: Run Pyright
        run: |
          cd backend
          uv run pyright

      - name: Frontend typecheck
        run: |
          cd frontend
          bun run typecheck

      # Builds the SPA, copies LICENSE where hatchling can see it, packages,
      # and fails if an artifact is missing the licence or bundles node_modules.
      - name: Build frontend and package
        run: bash scripts/package.sh
