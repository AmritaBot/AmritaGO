name: 功能建议
description: 为 AmritaGO 提出新功能或改进建议
title: '[功能建议] '
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        AmritaGO 仍在 Alpha 阶段，功能范围和实现方案可能调整。请描述实际使用场景，帮助我们判断需求。
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题或使用场景
      description: 目前如何完成这件事？有什么不便？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望的改进
      description: 描述你期望的行为或体验；不需要预先设计技术实现。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的替代方案
      description: 可选。是否已有临时解决办法或相关工具？
    validations:
      required: false